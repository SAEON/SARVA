listen_addresses: "0.0.0.0:3000"
base_path: /tiles
web_ui: enable-for-all
on_invalid: warn

postgres:
  connection_string: ${DATABASE_URL}
  default_srid: 3857
  auto_publish: false
  tables:
    municipal_boundaries:
      layer_id: municipalities
      schema: sarva
      table: municipal_boundaries
      srid: 3857
      geometry_column: geom
      id_column: gid
      minzoom: 0
      maxzoom: 14
      bounds: [16.45, -34.84, 32.95, -22.13]
      geometry_type: MULTIPOLYGON
      properties:
        gid: int4
        fid_1: int2
        objectid: int2
        province: varchar
        category: varchar
        cat2: varchar
        cat_b: varchar
        municname: varchar
        namecode: varchar
        map_title: varchar
        district: varchar
        district_n: varchar
        date: date
        shape__are: numeric
        shape__len: numeric
    mdb_2026_district_municipalities:
      layer_id: mdb_2026_district_municipalities
      schema: sarva
      table: mdb_2026_district_municipalities
      srid: 3857
      geometry_column: geom
      id_column: gid
      minzoom: 0
      maxzoom: 14
      bounds: [16.45, -34.84, 32.95, -22.13]
      geometry_type: MULTIPOLYGON
      properties:
        gid: int4
        source_fid: int4
        province: varchar
        category: varchar
        district: varchar
        district_n: varchar
        map_label: varchar
        category_n: varchar
        effective_date: date
    mdb_2026_local_municipalities:
      layer_id: mdb_2026_local_municipalities
      schema: sarva
      table: mdb_2026_local_municipalities
      srid: 3857
      geometry_column: geom
      id_column: gid
      minzoom: 0
      maxzoom: 14
      bounds: [16.45, -34.84, 32.95, -22.13]
      geometry_type: MULTIPOLYGON
      properties:
        gid: int4
        source_fid: int4
        province: varchar
        category: varchar
        cat2: varchar
        cat_b: varchar
        municname: varchar
        namecode: varchar
        map_title: varchar
        district: varchar
        district_n: varchar
        effective_date: date
    mdb_2026_wards:
      layer_id: mdb_2026_wards
      schema: sarva
      table: mdb_2026_wards
      srid: 3857
      geometry_column: geom
      id_column: gid
      minzoom: 5
      maxzoom: 16
      bounds: [16.45, -34.84, 32.95, -22.13]
      geometry_type: MULTIPOLYGON
      properties:
        gid: int4
        source_fid: int4
        province: varchar
        municipali: varchar
        cat_b: varchar
        wardid: varchar
        wardlink: varchar
        municname: varchar
        district: varchar
        districtco: varchar
        wardno: int4
        effective_date: date
    topography_contours:
      layer_id: topography_contours
      schema: sarva
      table: topography_contours
      srid: 3857
      geometry_column: geom
      id_column: gid
      minzoom: 9
      maxzoom: 14
      bounds: [16.45, -34.84, 32.95, -22.13]
      geometry_type: MULTILINESTRING
      properties:
        gid: int4
        elevation_m: int4
        contour_interval_m: int4
        source_name: text
        source_url: text
        source_date: text
        processing_note: text
    topography_slope_zones:
      layer_id: topography_slope_zones
      schema: sarva
      table: topography_slope_zones
      srid: 3857
      geometry_column: geom
      id_column: gid
      minzoom: 7
      maxzoom: 14
      bounds: [16.45, -34.84, 32.95, -22.13]
      geometry_type: MULTIPOLYGON
      properties:
        gid: int4
        slope_class: text
        slope_min_degrees: numeric
        slope_max_degrees: numeric
        source_name: text
        source_url: text
        source_date: text
        processing_note: text

    access_roads:
      layer_id: access_roads
      schema: sarva
      table: access_roads
      srid: 3857
      geometry_column: geom
      id_column: id
      geometry_type: LINESTRING
      minzoom: 0
      maxzoom: 16
      properties:
        id: int8
        source_id: int8
        edit_id: int8
        name: text
        category: text
        kind: text
        provenance: text

    access_facilities:
      layer_id: access_facilities
      schema: sarva
      table: access_facilities
      srid: 3857
      geometry_column: geom
      id_column: id
      geometry_type: POINT
      minzoom: 0
      maxzoom: 16
      properties:
        id: int8
        source_id: int8
        edit_id: int8
        name: text
        category: text
        kind: text
        provenance: text

    access_zones:
      layer_id: access_zones
      schema: sarva
      table: access_zones
      srid: 3857
      geometry_column: geom
      id_column: id
      geometry_type: POLYGON
      minzoom: 0
      maxzoom: 16
      properties:
        id: int8
        source_id: int8
        edit_id: int8
        name: text
        category: text
        kind: text
        provenance: text
